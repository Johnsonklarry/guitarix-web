<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151210">

<!-- No manifest and no home-screen icons: this is a page you visit, not an app
     you install. Nothing here can reach the rig, so there is nothing to keep. -->
<title>Guitarix</title>
<!-- Shared theme kit (no switcher on the public page: Fireside, or the visitor's saved choice) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;600&amp;family=Barlow+Condensed:wght@500;600&amp;family=Cormorant+Garamond:wght@500;600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="{{ asset('theme-kit/themes.css') }}">
<script src="{{ asset('theme-kit/theme.js') }}"></script>
<link rel="stylesheet" href="{{ asset('style.css') }}">
<link rel="stylesheet" href="{{ asset('broadcast.css') }}">
</head>

<body>
<main class="stage">

  <p class="lamp-row" id="app-status" data-region="status">
    <span class="pilot" id="pilot" aria-hidden="true"></span>
    <span class="status" id="status">Connecting</span>
  </p>

  <div class="now" id="app-header" data-region="header">
    <p class="bank" id="bank"></p>
    <h1 class="preset" id="preset">&mdash;</h1>
  </div>

  <p class="rolling" id="rolling" data-region="broadcast-status" hidden role="status">
    <span class="rolling__lamp" aria-hidden="true"></span>
    <span>Recording</span>
  </p>

  <p class="takes" id="takes"></p>

  <!-- The stream is an ordinary <audio> element pointed at /monitor.mp3, the one
       route besides this page that a broadcast server answers. Controls are the
       browser's own: play, pause and volume, and nothing else exists to offer. -->
  <div class="listen" id="transport-controls" data-region="transport-controls">
    <audio id="stream" preload="none" controls src="/monitor.mp3" aria-label="Live guitar rig monitor stream"></audio>
  </div>

</main>

<script src="{{ asset('socket.io.min.js') }}"></script>
<script>window.io || document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');</script>
<script src="{{ asset('broadcast.js') }}"></script>
</body>
</html>
